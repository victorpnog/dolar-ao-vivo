<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Cotações</title>
    <style>
        :root {
            --bg-principal: #f8fafc;
            --bg-card: #ffffff;
            --texto-p: #1e293b;
            --texto-s: #64748b;
            --verde-sucesso: #10b981;
            --verde-escuro: #065f46;
            --azul-link: #3b82f6;
            --azul-hover: #2563eb;
            --vermelho-erro: #ef4444;
            --borda: #e2e8f0;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-p);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--texto-p);
            letter-spacing: -0.5px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 32px;
        }

        .card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--borda);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            flex: 1;
            min-width: 280px;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--verde-sucesso);
        }

        .card.brent::before { background-color: #f59e0b; } 
        .card.wti::before { background-color: #3b82f6; } 

        .card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--texto-s);
            margin: 0 0 4px 0;
            font-weight: 600;
        }
        
        .desc-ativo {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 12px;
            display: block;
        }

        .valor-principal {
            font-size: 38px;
            font-weight: 800;
            color: var(--texto-p);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .valor-secundario {
            font-size: 15px;
            color: var(--verde-escuro);
            background: #ecfdf5;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 500;
        }

        .carregando {
            font-size: 20px;
            color: var(--texto-s);
            font-weight: 400;
            animation: pulse 1.5s infinite;
        }

        .erro {
            color: var(--vermelho-erro) !important;
            font-size: 20px !important;
        }

        .footer-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn-atualizar {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            background-color: var(--azul-link);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
            transition: background var(--azul-hover) 0.2s, transform 0.1s;
        }

        .btn-atualizar:hover {
            background-color: var(--azul-hover);
        }

        .btn-atualizar:active {
            transform: scale(0.98);
        }

        #atualizado {
            font-size: 12px;
            color: var(--texto-s);
            font-weight: 400;
            min-height: 14px;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="header-title">Mercado em Tempo Real</div>

    <div class="container">
        <div class="card">
            <h2>Dólar Comercial</h2>
            <span class="desc-ativo">USD/BRL</span>
            <div id="valor-dolar" class="valor-principal">Carregando...</div>
            <div id="sub-dolar" class="valor-secundario">Turismo/Bid</div>
        </div>
        
        <div class="card brent">
            <h2>Petróleo Brent</h2>
            <span class="desc-ativo">Referência Global (Europa/Mar do Norte)</span>
            <div id="valor-brent-usd" class="valor-principal">Carregando...</div>
        </div>

        <div class="card wti">
            <h2>Petróleo WTI</h2>
            <span class="desc-ativo">Referência Americana (West Texas Intermediate)</span>
            <div id="valor-wti-usd" class="valor-principal">Carregando...</div>
        </div>
    </div>

    <div class="footer-zone">
        <button class="btn-atualizar" onclick="atualizarDados()">Atualizar Agora</button>
        <div id="atualizado"></div>
    </div>

    <script>
        // 1. Busca Cotação do Dólar
        async function carregarDolar() {
            try {
                const response = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL');
                const data = await response.json();
                const cotacaoDolar = parseFloat(data.USDBRL.bid);
                
                const el = document.getElementById('valor-dolar');
                el.innerText = 'R$ ' + cotacaoDolar.toFixed(2);
                el.classList.remove('erro');
            } catch (erro) {
                const el = document.getElementById('valor-dolar');
                el.innerText = 'Erro';
                el.classList.add('erro');
                console.error('Erro Dólar:', erro);
            }
        }

        // 2. Busca Petróleo: 3 Proxies simultâneos para ultra velocidade (Fastest Wins)
        async function carregarPetroleo(ticker, idUsd) {
            try {
                const urlYahoo = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`;
                
                // Dispara requisições para TRÊS proxies ao mesmo tempo
                const req1 = fetch(`https://corsproxy.io/?${encodeURIComponent(urlYahoo)}`, { cache: "no-store" })
                    .then(r => r.ok ? r.json() : Promise.reject('Proxy 1 falhou'));
                    
                const req2 = fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(urlYahoo)}`, { cache: "no-store" })
                    .then(r => r.ok ? r.json() : Promise.reject('Proxy 2 falhou'));
                    
                const req3 = fetch(`https://api.codetabs.com/v1/proxy?quest=${urlYahoo}`, { cache: "no-store" })
                    .then(r => r.ok ? r.json() : Promise.reject('Proxy 3 falhou'));

                // Promise.any pega o primeiro que responder (o mais rápido)
                const data = await Promise.any([req1, req2, req3]);

                // Pega o valor
                const precoUSD = parseFloat(data.chart.result[0].meta.regularMarketPrice);
                
                // Atualiza o HTML
                const elUsd = document.getElementById(idUsd);
                elUsd.innerText = 'US$ ' + precoUSD.toFixed(2);
                elUsd.classList.remove('erro');

            } catch (erro) {
                // Se TODOS os proxies falharem
                const elUsd = document.getElementById(idUsd);
                elUsd.innerText = 'Indisponível';
                elUsd.classList.add('erro');
                console.error(`Erro Petróleo (${ticker}): Todos os servidores falharam.`);
            }
        }

        // Função principal
        async function atualizarDados() {
            // Coloca tudo em estado de carregamento
            document.getElementById('valor-dolar').innerHTML = '<span class="carregando">Carregando...</span>';
            document.getElementById('valor-brent-usd').innerHTML = '<span class="carregando">Carregando...</span>';
            document.getElementById('valor-wti-usd').innerHTML = '<span class="carregando">Carregando...</span>';
            
            // Promise.all executa as 3 funções SIMULTANEAMENTE (Deixa o carregamento super rápido)
            await Promise.all([
                carregarDolar(),
                carregarPetroleo('BZ=F', 'valor-brent-usd'),
                carregarPetroleo('CL=F', 'valor-wti-usd')
            ]);
            
            const dataHora = new Date().toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('atualizado').innerText = 'Última atualização em: ' + dataHora;
        }

        // Inicia na abertura da página
        atualizarDados();
        
        // Loop a cada 60s
        setInterval(atualizarDados, 60000);
    </script>
</body>
</html>
